[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-triage"
version = "0.1.0"
description = "Rank an issue's competing pull requests with evidence, and measure how well the checks work."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Daniel Boles" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
study = ["matplotlib"]

[project.scripts]
pr-triage = "pr_triage.cli:main"

[tool.setuptools]
packages = ["pr_triage", "pr_triage.checks"]

[tool.setuptools.package-data]
pr_triage = ["weights.json"]
